<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Decision Matrix 2026 — Interactive Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #06050c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #8b5cf6;
            --accent-indigo: #4f46e5;
            --accent-blue: #06b6d4;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --glow-color: rgba(139, 92, 246, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 900px) {
            .container {
                grid-template-columns: 380px 1fr;
            }
        }

        /* Header Styling */
        header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.5rem;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .logo-container img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
            border: 1.5px solid var(--accent-purple);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        .title-container h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, var(--text-primary), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-container p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
        }

        /* Sidebar / Configuration Form */
        .config-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            height: fit-content;
        }

        .config-panel h2 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .select-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .select-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }

        .radio-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .radio-option {
            position: relative;
        }

        .radio-option input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .radio-label {
            display: block;
            text-align: center;
            padding: 0.7rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .radio-option input:checked + .radio-label {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
            color: white;
        }

        .radio-option:hover .radio-label {
            border-color: var(--accent-purple);
        }

        /* Results Area */
        .results-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .recommendation-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        @media (min-width: 600px) {
            .recommendation-cards {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .rec-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.2rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .rec-card:hover {
            transform: translateY(-4px);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .rec-card.primary {
            border-color: var(--accent-purple);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.15);
            background: linear-gradient(180deg, rgba(139, 92, 246, 0.03), rgba(0,0,0,0));
        }

        .badge {
            position: absolute;
            top: 0.8rem;
            right: 0.8rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .badge.primary {
            background: var(--accent-purple);
            color: white;
        }

        .badge.secondary {
            background: var(--accent-indigo);
            color: white;
        }

        .badge.tertiary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            border: 1px solid var(--card-border);
        }

        .rec-rank {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-purple);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .rec-name {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .rec-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 1.2rem;
        }

        .score-box {
            display: flex;
            align-items: baseline;
            gap: 0.2rem;
            margin-top: auto;
        }

        .score-val {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .score-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Detailed Profile Panel */
        .profile-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.8rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1rem;
            margin-bottom: 1.2rem;
        }

        .profile-title h3 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .profile-title p {
            font-size: 0.85rem;
            color: var(--accent-purple);
            font-weight: 500;
            margin-top: 0.1rem;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 600px) {
            .spec-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .spec-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.8rem;
        }

        .spec-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.2rem;
        }

        .spec-val {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .rationale-box {
            background: rgba(139, 92, 246, 0.05);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .rationale-box h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-purple);
            margin-bottom: 0.4rem;

        .rationale-box p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-primary);
        }

        /* Matrix Table in Results */

            overflow-x: auto;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            font-weight: 600;
            padding: 0.8rem 1rem;
            border-bottom: 1.5px solid var(--card-border);
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 0.9rem 1rem;
            border-bottom: 1px solid var(--card-border);
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .score-badge {
            background: rgba(139, 92, 246, 0.15);
            color: var(--accent-purple);
            font-weight: 700;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .score-badge.high {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-blue);
        }
    </style>
</head>

                    <label for="privacy-sovereign" class="radio-label">Self-Host</label>

            </div>
        </div>
    </div>

    <div class="results-panel">

        </div>

                        </tr>
                    </thead>
                    <tbody id="matrix-table-body">
                        <!-- Dynamic Injection -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

            costInput: '$0.14',
            costOutput: '$0.28',
            type: 'Open Weights',
            privacyText: 'Air-gapped VPC',
            scores: { cost: 9.2, reasoning: 8, speed: 8, privacy: 10, overall: 8.7 },
            description: 'The highest-performing open weights coding assistant, supporting over 300 languages.',
            rationales: {
                code: 'Excellent candidate for hosting within private corporate networks to avoid code leaks.'
            }
        },
        'whisper-v3': {
            id: 'whisper-v3',
            name: 'Whisper v3',
            context: '30-sec chunks',
            modalities: 'Audio (Speech)',
            costInput: 'Self-Host',
            costOutput: 'Self-Host',
            type: 'Open Source',
            privacyText: 'Air-gapped VPC',
            scores: { cost: 9.5, reasoning: 6, speed: 8, privacy: 10, overall: 9.2 },
            description: 'State-of-the-art open-source audio transcriber offering offline localized deployment.',
            rationales: {
                audio: 'The absolute default choice for corporate call transcription pipelines to ensure privacy.'
            }
        }
    };

    // DOM References
    const selectUseCase = document.getElementById('useCase');
    const radioBudgetOptions = document.getElementsByName('budget');
    const radioPrivacyOptions = document.getElementsByName('privacy');
    const containerCards = document.getElementById('recommendation-cards-container');
    const containerProfile = document.getElementById('profile-panel-container');
    const containerTableBody = document.getElementById('matrix-table-body');

    let selectedModelId = '';

    // Main Selection Matrix Scoring Logic
    function getRecommendations() {
        const selectedUseCase = selectUseCase.value;
        
        let selectedBudget = 'moderate';
        for (const radio of radioBudgetOptions) {
            if (radio.checked) selectedBudget = radio.value;
        }

        let selectedPrivacy = 'public';
        for (const radio of radioPrivacyOptions) {
            if (radio.checked) selectedPrivacy = radio.value;
        }

        const candidates = [];

        for (const [id, data] of Object.entries(modelData)) {
            let scoreModifier = 0;

            // 1. Privacy Filter
            if (selectedPrivacy === 'sovereign') {
                if (data.type !== 'Open Weights' && data.type !== 'Open Source') {
                    // Heavily penalize proprietary models for full sovereign requirements
                    scoreModifier -= 8;
                } else {
                    scoreModifier += 5;
                }
            } else if (selectedPrivacy === 'zdr') {
                // Azure / Bedrock endpoints have ZDR properties
                if (data.privacyText.includes('ZDR') || data.privacyText.includes('VPC') || data.type.includes('Open')) {
                    scoreModifier += 3;
                } else {
                    scoreModifier -= 3;
                }
            }

            // 2. Budget Mapping
            if (selectedBudget === 'low') {
                scoreModifier += (data.scores.cost - 5) * 1.5;
            } else if (selectedBudget === 'high') {
                scoreModifier += (10 - data.scores.cost) * 0.5; // Don't penalize expensive models
                scoreModifier += (data.scores.reasoning - 5) * 1.5; // Focus heavily on intelligence
            } else {
                // Moderate
                if (data.scores.cost >= 5 && data.scores.cost <= 8) {
                    scoreModifier += 2;
                }
            }

            // 3. Use Case Targeting
            let useCasePriority = 0;
            switch(selectedUseCase) {
                case 'chat':
                    if (id === 'gemini-1-5-flash' || id === 'gpt-4o-mini') useCasePriority += 6;
                    if (id === 'gpt-4o' || id === 'llama-3-1-70b') useCasePriority += 4;
                    break;
                case 'legal':
                    if (id === 'claude-3-7-sonnet') useCasePriority += 6;
                    if (id === 'gemini-1-5-pro') useCasePriority += 5;
                    if (id === 'o1') useCasePriority += 4;
                    break;
                case 'code':
                    if (id === 'claude-3-7-sonnet' || id === 'deepseek-coder-v2') useCasePriority += 6;
                    if (id === 'o3-mini') useCasePriority += 5;
                    break;
                case 'rag':
                    if (id === 'llama-3-1-70b' || id === 'gemini-1-5-pro') useCasePriority += 6;
                    if (id === 'gpt-4o' || id === 'gpt-4o-mini') useCasePriority += 4;
                    break;
                case 'reasoning':
                    if (id === 'o1' || id === 'deepseek-r1') useCasePriority += 7;
                    if (id === 'o3-mini' || id === 'claude-3-7-sonnet') useCasePriority += 4;
                    break;
                case 'ocr':
                    if (id === 'gpt-4o') useCasePriority += 6;
                    if (id === 'claude-3-7-sonnet' || id === 'gemini-1-5-pro') useCasePriority += 4;
                    break;
                case 'content':
                    if (id === 'claude-3-7-sonnet') useCasePriority += 6;
                    if (id === 'gpt-4o' || id === 'llama-3-1-70b') useCasePriority += 4;
                    break;
                case 'audio':
                    if (id === 'whisper-v3') useCasePriority += 7;
                    if (id === 'gemini-1-5-flash') useCasePriority += 5;
                    break;
                case 'finance':
                    if (id === 'claude-3-7-sonnet') useCasePriority += 6;
                    if (id === 'llama-3-1-405b' || id === 'o1') useCasePriority += 4;
                    break;
                case 'assistant':
                    if (id === 'gpt-4o-mini') useCasePriority += 6;
                    if (id === 'llama-3-2-3b' || id === 'llama-3-1-70b') useCasePriority += 4;
                    break;
            }

            candidates.push({
                ...data,
                totalScore: data.scores.overall + scoreModifier + useCasePriority
            });
        }

        // Sort descending by totalScore
        candidates.sort((a, b) => b.totalScore - a.totalScore);
        
        return candidates.slice(0, 3);
    }

    // Render dashboard panels
    function render() {
        const top3 = getRecommendations();
        
        // Select the primary recommendation as active profile if not already set or not in the top 3
        if (!selectedModelId || !top3.some(m => m.id === selectedModelId)) {
            selectedModelId = top3[0].id;
        }

        // Render recommendation cards
        containerCards.innerHTML = '';
        const ranks = ['primary', 'secondary', 'tertiary'];
        const rankLabels = ['Top Choice', 'Secondary Option', 'Tertiary Option'];

        top3.forEach((model, index) => {
            const rankClass = ranks[index];
            const activeClass = model.id === selectedModelId ? 'active primary' : '';
            
            const cardHTML = `
                <div class="rec-card ${activeClass}" onclick="selectModel('${model.id}')">
                    <span class="badge ${rankClass}">${rankLabels[index]}</span>
                    <div>
                        <div class="rec-rank">Rank #${index + 1}</div>
                        <div class="rec-name">${model.name}</div>
                        <div class="rec-desc">${model.description}</div>
                    </div>
                    <div class="score-box">
                        <span class="score-val">${model.scores.overall.toFixed(1)}</span>
                        <span class="score-label">/ 10.0</span>
                    </div>
                </div>
            `;
            containerCards.insertAdjacentHTML('beforeend', cardHTML);
        });

        // Render detailed profile panel
        const currentModel = modelData[selectedModelId];
        const selectedUseCaseKey = selectUseCase.value;
        const customRationale = currentModel.rationales[selectedUseCaseKey] || currentModel.rationales['assistant'] || 'Highly optimized for operational pipeline execution matching these constraints.';

        containerProfile.innerHTML = `
            <div class="profile-header">
                <div class="profile-title">
                    <h3>${currentModel.name}</h3>
                    <p>${currentModel.type} — ${currentModel.modalities}</p>
                </div>
                <div class="score-box" style="margin-top: 0;">
                    <span class="score-val" style="font-size: 2rem; color: var(--accent-purple);">${currentModel.scores.overall.toFixed(1)}</span>
                    <span class="score-label">Overall Rating</span>
                </div>
            </div>

            <div class="spec-grid">
                <div class="spec-item">
                    <div class="spec-label">Context Limit</div>
                    <div class="spec-val">${currentModel.context}</div>
                </div>
                <div class="spec-item">
                    <div class="spec-label">Input / 1M</div>
                    <div class="spec-val">${currentModel.costInput}</div>
                </div>
                <div class="spec-item">
                    <div class="spec-label">Output / 1M</div>
                    <div class="spec-val">${currentModel.costOutput}</div>
                </div>
                <div class="spec-item">
                    <div class="spec-label">Compliance</div>
                    <div class="spec-val" style="font-size:0.8rem;">${currentModel.privacyText}</div>
                </div>
            </div>

            <div class="rationale-box">
                <h4>CTO Selection Rationale</h4>
                <p>${customRationale}</p>
            </div>
        `;

        // Render comparison table
        containerTableBody.innerHTML = '';
        top3.forEach(model => {
            const rowHTML = `
                <tr>
                    <td style="font-weight:600;">${model.name}</td>
                    <td><span class="score-badge">${model.scores.cost}/10</span></td>
                    <td><span class="score-badge">${model.scores.reasoning}/10</span></td>
                    <td><span class="score-badge">${model.scores.speed}/10</span></td>
                    <td><span class="score-badge">${model.scores.privacy}/10</span></td>
                    <td><span class="score-badge high">${model.scores.overall}/10</span></td>
                </tr>
            `;
            containerTableBody.insertAdjacentHTML('beforeend', rowHTML);
        });
    }

    function selectModel(id) {
        selectedModelId = id;
        render();
    }

    // Attach Event Listeners
    selectUseCase.addEventListener('change', render);
    
    for (const radio of radioBudgetOptions) {
        radio.addEventListener('change', render);
    }

    for (const radio of radioPrivacyOptions) {
        radio.addEventListener('change', render);
    }

    // Initial render
    render();
</script>

</body>
</html>
